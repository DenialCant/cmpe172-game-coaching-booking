spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql
spring.sql.init.data-locations=classpath:data-test.sql
spring.thymeleaf.cache=false

notifications.base-url=http://127.0.0.1:1
notifications.connect-timeout-ms=50
notifications.read-timeout-ms=100
notifications.max-attempts=2
notifications.retry-delay-ms=0
notifications.retry-interval-ms=86400000
notifications.retry-initial-delay-ms=86400000
