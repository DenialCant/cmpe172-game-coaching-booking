spring.application.name=game-coaching-booking

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/game_coaching}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql

spring.thymeleaf.cache=false
server.servlet.session.timeout=30m

# Bounded pool waits also bound /health when the database is unavailable.
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
server.port=${PORT:8080}

# Same-project mock controller, reached through an actual HTTP boundary.
notifications.base-url=${NOTIFICATION_BASE_URL:http://localhost:${server.port}}
notifications.token=${NOTIFICATION_TOKEN:local-demo-token}
notifications.connect-timeout-ms=${NOTIFICATION_CONNECT_TIMEOUT_MS:500}
notifications.read-timeout-ms=${NOTIFICATION_READ_TIMEOUT_MS:1000}
notifications.max-attempts=${NOTIFICATION_MAX_ATTEMPTS:3}
notifications.retry-delay-ms=${NOTIFICATION_RETRY_DELAY_MS:100}
notifications.retry-interval-ms=${NOTIFICATION_RETRY_INTERVAL_MS:30000}
notifications.retry-initial-delay-ms=${NOTIFICATION_RETRY_INITIAL_DELAY_MS:30000}
notifications.stub.enabled=${NOTIFICATION_STUB_ENABLED:true}
