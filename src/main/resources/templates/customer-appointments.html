<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Appointments - Skill Cap</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><nav class="nav"><div class="container nav-inner"><a class="brand" th:href="@{/}">Skill Cap</a><a th:href="@{/slots}">Available Slots</a><a th:href="@{/customer/appointments}">My Appointments</a><form th:action="@{/logout}" method="post"><button class="link-button">Logout</button></form></div></nav><main class="container"><div class="eyebrow">Customer dashboard</div><h1>My appointments</h1><p class="notice" th:if="${param.cancelled}">The appointment was cancelled.</p><div class="appointment-list"><article class="card slot" th:each="appointment : ${appointments}"><div><h3 th:text="${appointment.serviceName}"></h3><div class="meta"><span th:text="${'Coach: ' + appointment.providerName}"></span><span th:text="${#temporals.format(appointment.startTime, 'MMM d, yyyy h:mm a')}"></span><span class="status" th:classappend="${'status-' + appointment.status}" th:text="${appointment.status}"></span></div></div><form th:if="${appointment.status == 'BOOKED'}" th:action="@{/customer/appointments/{id}/cancel(id=${appointment.appointmentId})}" method="post"><button class="button danger small" type="submit">Cancel</button></form></article><div class="card center" th:if="${#lists.isEmpty(appointments)}">You do not have any appointments yet.</div></div></main></body></html>
