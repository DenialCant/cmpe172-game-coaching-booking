<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Provider Dashboard - Skill Cap</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><nav class="nav"><div class="container nav-inner"><a class="brand" th:href="@{/}">Skill Cap</a><a th:href="@{/slots}">Available Slots</a><a th:href="@{/provider/dashboard}">Provider Dashboard</a><form th:action="@{/logout}" method="post"><button class="link-button">Logout</button></form></div></nav><main class="container"><div class="eyebrow">Provider tools</div><h1>Coach dashboard</h1><p class="notice" th:if="${param.created}">Availability slot created.</p><p class="notice" th:if="${param.removed}">Availability slot removed.</p>
<section class="card"><h2>Create availability</h2><form class="filters" th:action="@{/provider/slots}" th:object="${availabilityForm}" method="post"><label>Service<select th:field="*{serviceId}"><option value="0">Choose service</option><option th:each="service : ${services}" th:value="${service.serviceId}" th:text="${service.serviceName}"></option></select><span class="error-text" th:errors="*{serviceId}"></span></label><label>Start<input type="datetime-local" th:field="*{startTime}"><span class="error-text" th:errors="*{startTime}"></span></label><label>End<input type="datetime-local" th:field="*{endTime}"><span class="error-text" th:errors="*{endTime}"></span></label><button class="button" type="submit">Create Slot</button></form></section>
<section class="section"><h2>My availability</h2><div class="slot-list"><article class="card slot" th:each="slot : ${slots}"><div><h3 th:text="${slot.serviceName}"></h3><div class="meta"><span th:text="${#temporals.format(slot.startTime, 'MMM d, yyyy h:mm a')}"></span><span th:text="${slot.durationMinutes + ' minutes'}"></span></div></div><form th:action="@{/provider/slots/{id}/remove(id=${slot.slotId})}" method="post"><button class="button danger small" type="submit">Remove</button></form></article></div></section>
<section class="section"><h2>Appointments booked with me</h2><div class="table-wrap card"><table><thead><tr><th>Customer</th><th>Service</th><th>Start</th><th>Status</th></tr></thead><tbody><tr th:each="appointment : ${appointments}"><td th:text="${appointment.customerName}"></td><td th:text="${appointment.serviceName}"></td><td th:text="${#temporals.format(appointment.startTime, 'MMM d, yyyy h:mm a')}"></td><td><span class="status" th:classappend="${'status-' + appointment.status}" th:text="${appointment.status}"></span></td></tr><tr th:if="${#lists.isEmpty(appointments)}"><td colspan="4">No appointments have been booked yet.</td></tr></tbody></table></div></section>
</main></body></html>
