<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Available Slots - Skill Cap</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<nav class="nav"><div class="container nav-inner"><a class="brand" th:href="@{/}">Skill Cap</a><a th:href="@{/slots}">Available Slots</a><a th:if="${session.role == 'CUSTOMER'}" th:href="@{/customer/appointments}">My Appointments</a><a th:if="${session.role == 'PROVIDER'}" th:href="@{/provider/dashboard}">Provider Dashboard</a><a th:if="${session.userId == null}" th:href="@{/login}">Login</a><form th:if="${session.userId != null}" th:action="@{/logout}" method="post"><button class="link-button">Logout</button></form></div></nav>
<main class="container"><div class="eyebrow">Find a session</div><h1>Available coaching slots</h1>
<form class="card filters" method="get" th:action="@{/slots}"><label>Coach<select name="providerId"><option value="">All coaches</option><option th:each="provider : ${providers}" th:value="${provider.providerId}" th:text="${provider.providerName}" th:selected="${providerId == provider.providerId}"></option></select></label><label>Service<select name="serviceId"><option value="">All services</option><option th:each="service : ${services}" th:value="${service.serviceId}" th:text="${service.serviceName}" th:selected="${serviceId == service.serviceId}"></option></select></label><label>Date<input type="date" name="date" th:value="${date}"></label><button class="button" type="submit">Apply filters</button></form>
<div class="slot-list"><article class="card slot" th:each="slot : ${result.items}"><div><h3 th:text="${slot.serviceName}">Valorant Aim Coaching</h3><div class="meta"><span th:text="${'Coach: ' + slot.providerName}"></span><span th:text="${#temporals.format(slot.startTime, 'MMM d, yyyy h:mm a')}"></span><span th:text="${slot.durationMinutes + ' minutes'}"></span></div></div><form th:if="${session.role == 'CUSTOMER'}" th:action="@{/customer/appointments}" method="post"><input type="hidden" name="slotId" th:value="${slot.slotId}"><button class="button" type="submit">Book</button></form><a class="button" th:if="${session.userId == null}" th:href="@{/login}">Login to book</a></article><div class="card center" th:if="${#lists.isEmpty(result.items)}"><h3>No available slots found</h3><p class="muted">Try clearing a filter or selecting another date.</p></div></div>
<div class="pagination"><a class="button secondary small" th:if="${result.page > 0}" th:href="@{/slots(page=${result.page - 1},size=${result.size},providerId=${providerId},serviceId=${serviceId},date=${date})}">Previous</a><span th:text="${'Page ' + (result.page + 1) + ' of ' + result.totalPages}"></span><a class="button secondary small" th:if="${result.page + 1 < result.totalPages}" th:href="@{/slots(page=${result.page + 1},size=${result.size},providerId=${providerId},serviceId=${serviceId},date=${date})}">Next</a></div>
</main></body></html>
