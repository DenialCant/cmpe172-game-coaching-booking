services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: game_coaching
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - skill_cap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/game_coaching
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      NOTIFICATION_TOKEN: ${NOTIFICATION_TOKEN:?Set NOTIFICATION_TOKEN in .env}
      NOTIFICATION_BASE_URL: ${NOTIFICATION_BASE_URL:-http://localhost:8080}
      NOTIFICATION_STUB_ENABLED: ${NOTIFICATION_STUB_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  skill_cap_postgres_data:
