name: Skill Cap build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: skill_cap_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d skill_cap_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/skill_cap_ci
      POSTGRES_TEST_USERNAME: postgres
      POSTGRES_TEST_PASSWORD: local_ci_password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and run H2 plus PostgreSQL tests
        run: bash ./mvnw -B clean verify
      - name: Validate Compose
        env:
          DB_PASSWORD: local_ci_password
          NOTIFICATION_TOKEN: local_ci_notification_token
        run: docker compose config --quiet
      - name: Build Docker image
        run: docker build --tag skill-cap:ci .
